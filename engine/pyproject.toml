[project]
name = "calque-engine"
version = "0.1.0"
description = "Calque PPTX engine: DeckSpec to native PPTX on a brand pack template"
requires-python = ">=3.12"
dependencies = [
    "jsonschema>=4.26.0",
    "lxml>=6.1.3",
    "pydantic>=2.13.5",
    "python-pptx>=1.0.2",
    "pyyaml>=6.0.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/calque_engine"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# l / t / w / h are the geometry convention in drawing code
ignore = ["E741"]

[tool.pytest.ini_options]
testpaths = ["tests", "../packs"]
markers = ["golden: render decks and compare them to committed images (needs LibreOffice)"]
addopts = "-m 'not golden'"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]
