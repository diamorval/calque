name: pages
# The showcase: the web app on GitHub Pages, replaying decks and a design the real engine built (apps/web/demo).
on:
  push: { branches: [main] }
  # the build runs on PRs too, so a broken demo shows before the merge; only main deploys
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency: { group: "pages-${{ github.ref }}", cancel-in-progress: true }

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # optional: read access to the pack's pinned sources, for its brand fonts (fonts/ is not committed)
      GH_TOKEN: ${{ secrets.PACK_SOURCES_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked
        working-directory: engine
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libreoffice-impress poppler-utils
      - if: env.GH_TOKEN != ''
        run: pnpm pack:sync diametral
      # the demo design is laid out by Playwright's Chromium, without its sandbox (see ci.yml): the
      # runner image's /usr/bin/chromium hung on it (60 s timeout)
      - run: pnpm --filter @calque/web exec playwright install --with-deps chromium
      - run: echo "CALQUE_CHROMIUM=$(node --input-type=module -e "import { chromium } from '@playwright/test'; console.log(chromium.executablePath())")" >> "$GITHUB_ENV"
        working-directory: apps/web
      - run: node demo/snapshot.ts
        working-directory: apps/web
        env: { CALQUE_CHROMIUM_NO_SANDBOX: "1" }
      - run: pnpm --filter @calque/web exec vite build --base=/${{ github.event.repository.name }}/
        env: { VITE_DEMO: "1" }
      # deep links (/d/:id) land on 404.html: the same app
      - run: cp apps/web/dist/index.html apps/web/dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with: { path: apps/web/dist }

  deploy:
    if: github.event_name == 'push' || github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.deploy.outputs.page_url }}" }
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
